<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url>
    <loc>{{ SITEMAP_BASE }}/</loc>
  </url>
{%- for article in articles %}
  <url>
    <loc>{{ SITEMAP_BASE }}/{{ article.save_as }}</loc>
    <lastmod>{{ (article.modified or article.date).strftime('%Y-%m-%d') }}</lastmod>
  </url>
{%- endfor %}
{%- for page in pages %}
  <url>
    <loc>{{ SITEMAP_BASE }}/{{ page.save_as }}</loc>
  </url>
{%- endfor %}
</urlset>
