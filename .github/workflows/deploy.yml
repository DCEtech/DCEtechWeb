name: Build and Deploy Pelican Site

on:
  push:
    branches:
      - main  # Trigger deployment on push to main branch
  schedule: 
      - cron: '0 6 * * *'
  workflow_dispatch:  # Permite lanzarlo a mano desde Actions o con `gh workflow run`

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v5

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      
      - name: Set matplotlib backend
        run: |
          echo "MPLBACKEND=Agg" >> $GITHUB_ENV
      
      # Tests de ml/: si fallan, el job se para y no hay deploy
      - name: Run ML tests
        run: |
          python -m pytest ml -q -rs

      # Gráficas diarias (btc-latest.png y btc-tracker.png). Si yfinance falla,
      # reutiliza las de gh-pages y avisa; cualquier otro error para el job.
      - name: Update BTC charts
        run: |
          bash scripts/update_charts.sh

      # Build Pelican site
      - name: Build site
        run: |
          pelican content

      # Add custom domain
      - name: create CNAME file
        run: echo 'www.danielcejudo.com' > ./output/CNAME

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output