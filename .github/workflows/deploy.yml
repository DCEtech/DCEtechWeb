name: Build and Deploy Pelican Site

on:
  push:
    branches:
      - main  # Trigger deployment on push to main branch
  schedule: 
      - cron: '0 6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pelican markdown yfinance pandas_ta matplotlib scikit-learn joblib
      
      - name: Set matplotlib backend
        run: |
          echo "MPLBACKEND=Agg" >> $GITHUB_ENV
      
      # Update BTC data and generate plot
      - name: Update BTC plot
        run: |
          python scripts/update_btc.py

      # Build Pelican site
      - name: Build site
        run: |
          pelican content

      # Add custom domain
      - name: create CNAME file
        run: echo 'www.danielcejudo.com' > ./output/CNAME

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output